name: Test sparse and dense PBM
on:
  push:
    branches: [main, feat/sparse-pbm-spectral-fgw]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python benchmarks/bench_fgw_optimization.py --n 80 --landmarks 5 --restarts 2 --max-iter 35
      - run: python benchmarks/bench_sparse_pbm.py --n 12000 --grid 20 --repeats 3
